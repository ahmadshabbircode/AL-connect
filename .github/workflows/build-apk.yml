name: Build AI CONNECT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip AI_CONNECT_GitHub_APK_Build.zip -d extracted

      - name: Build Android APK
        working-directory: extracted/AIConnectAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CONNECT-APK
          path: extracted/AIConnectAndroid/app/build/outputs/apk/debug/app-debug.apk
